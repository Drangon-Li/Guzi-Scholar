name: Desktop release candidates

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      action:
        description: Build a verified draft, or explicitly publish an accepted draft
        type: choice
        options: [draft, promote]
        default: draft
        required: true
      release_tag:
        description: Existing tag matching all package versions (vX.Y.Z or vX.Y.Z-beta.N)
        type: string
        required: true
      acceptance_run_id:
        description: Successful Desktop release acceptance run ID; required for promote
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      channel: ${{ steps.context.outputs.channel }}
      commit: ${{ steps.context.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate tag, versions and origin/main ancestry
        id: context
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          node apps/desktop/scripts/release-pipeline.cjs preflight "$RELEASE_TAG" release-context.json
          node apps/desktop/tests/mac_release_test.js
          node apps/desktop/tests/release_pipeline_test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-context
          path: release-context.json
          if-no-files-found: error

  macos:
    if: inputs.action != 'promote'
    needs: validate
    runs-on: macos-15 # Standard Apple Silicon runner; runner-images/README.md
    timeout-minutes: 90
    env:
      GUZI_UPDATE_CHANNEL: ${{ needs.validate.outputs.channel }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          architecture: arm64
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: arm64
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - name: Install locked dependencies and build runtime
        run: |
          python3 -m pip install --disable-pip-version-check certifi==2025.8.3
          npm ci --prefix apps/desktop
          npm --prefix apps/desktop run check:release-contracts
          npm run desktop:check
          npm --prefix apps/desktop run prepare:mac
      - name: Build ad-hoc macOS arm64 DMG and Sparkle ZIP
        run: node apps/desktop/scripts/build-mac-target.cjs all internal
      - name: Verify package runtime boundary
        shell: bash
        run: |
          app=(apps/desktop/dist/mac.noindex/mac-arm64/*.app)
          test "${#app[@]}" -eq 1
          node apps/desktop/tests/mac_release_test.js "${app[0]}"
      - name: Sign the updater archive and verify the embedded public key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          archive=(apps/desktop/dist/mac.noindex/*-arm64-${GUZI_UPDATE_CHANNEL}.zip)
          app=(apps/desktop/dist/mac.noindex/mac-arm64/*.app)
          test "${#archive[@]}" -eq 1
          test "${#app[@]}" -eq 1
          node apps/desktop/scripts/release-sign-mac.cjs "${archive[0]}" "${app[0]}" apps/desktop/build/updater/Sparkle-2.10.1/bin/sign_update mac-signature.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: |
            apps/desktop/dist/mac.noindex/*.dmg
            apps/desktop/dist/mac.noindex/*-arm64-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-signature
          path: mac-signature.json
          if-no-files-found: error

  windows:
    if: inputs.action != 'promote'
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GUZI_UPDATE_CHANNEL: ${{ needs.validate.outputs.channel }}
      GUZI_WINDOWS_BUILD_MODE: internal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --prefix apps/desktop
      - name: Check release contracts before packaging
        run: npm --prefix apps/desktop run check:release-contracts
      - name: Install Electron package test driver
        shell: pwsh
        run: |
          npm install --global playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MY_SCHOLAR_PLAYWRIGHT_MODULE=$(npm root -g)/playwright" >> $env:GITHUB_ENV
      - name: Build and verify Windows x64 candidate
        run: |
          npm run check:windows
          npm run build:windows
          npm run verify:windows:artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            platforms/windows/dist/*.exe
            platforms/windows/dist/*.blockmap
            platforms/windows/dist/*.zip
            platforms/windows/dist/${{ needs.validate.outputs.channel == 'stable' && 'latest' || 'beta' }}.yml
          if-no-files-found: error

  draft:
    if: inputs.action != 'promote'
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: candidate-inputs
      - name: Download and verify the bundled PDF runtime source archives
        run: |
          mkdir candidate
          curl --fail --location --retry 3 --output candidate/pymupdf-1.28.2.tar.gz https://files.pythonhosted.org/packages/a3/fb/b6761fa2d5266f2cdb24c3b91f4023070ab7848381417678e7a289a1d52a/pymupdf-1.28.2.tar.gz
          curl --fail --location --retry 3 --output candidate/mupdf-1.28.2-source.tar.gz https://mupdf.com/downloads/archive/mupdf-1.28.2-source.tar.gz
          printf '%s\n' '5e0be7908a715aa20333caddd73f1d6f01e4cd0c26e869fa2dd0b7f344da2249  candidate/pymupdf-1.28.2.tar.gz' '44075a84e329db55b9bef5f342a70fd26d69e48ad1d33cb89d9664581c641156  candidate/mupdf-1.28.2-source.tar.gz' | sha256sum --check
          test "$(stat -c %s candidate/pymupdf-1.28.2.tar.gz)" -eq 87903557
          test "$(stat -c %s candidate/mupdf-1.28.2-source.tar.gz)" -eq 68898646
      - name: Assemble manifest, provenance and checksums before creating a draft
        run: |
          cp candidate-inputs/release-macos/* candidate/
          cp candidate-inputs/release-windows/* candidate/
          node apps/desktop/scripts/release-pipeline.cjs prepare candidate candidate-inputs/release-context/release-context.json candidate-inputs/release-macos-signature/mac-signature.json
      - name: Create new draft, upload and re-download every asset for verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/release-pipeline.cjs draft candidate candidate-inputs/release-context/release-context.json

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-context
          path: context
      - name: Require an explicit acceptance run
        env:
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
        run: '[[ "$ACCEPTANCE_RUN_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guzi-release-acceptance
          run-id: ${{ inputs.acceptance_run_id }}
          github-token: ${{ github.token }}
          path: acceptance
      - name: Revalidate remote draft and both real upgrade reports, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
        run: node apps/desktop/scripts/release-pipeline.cjs promote context/release-context.json acceptance "$ACCEPTANCE_RUN_ID"
