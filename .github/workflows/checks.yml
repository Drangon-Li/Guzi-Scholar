name: Checks

on:
  pull_request:
  push:
    branches: [main, redesign-v2]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commits and working tree
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  desktop:
    name: Desktop checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Install shell syntax checker
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh
      - name: Check JavaScript and shell syntax
        run: npm run desktop:check:syntax
      - name: Run Python unit tests
        run: npm --prefix apps/desktop run test:unit
      - name: Run graph and storage checks
        run: |
          npm --prefix apps/desktop run test:graph
          npm --prefix apps/desktop run test:storage

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Install ruff
        # Pinned: a new ruff release can add rules and turn this job red on an
        # unrelated pull request.
        run: python3 -m pip install --quiet ruff==0.16.4
      - name: Lint JavaScript and Python
        run: npm --prefix apps/desktop run lint

  ui:
    name: UI smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Install Playwright and Chromium
        run: |
          npm install --global playwright
          playwright install --with-deps chromium
          echo "MY_SCHOLAR_PLAYWRIGHT_MODULE=$(npm root -g)/playwright" >> "$GITHUB_ENV"
      # The runner seeds a fresh library and starts a dedicated server for each
      # suite, and prints that server's log when a suite fails.
      - name: Run UI smoke tests
        run: npm --prefix apps/desktop run test:ui:ci

  runtime:
    name: Runtime checks (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      # macOS-only: two of these three check the packaged bundle and the mac
      # release layout, so they cannot run on the Linux jobs above.
      - name: Run runtime, installation and release checks
        run: npm --prefix apps/desktop run test:runtime
