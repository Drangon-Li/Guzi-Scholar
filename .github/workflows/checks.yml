name: Checks

on:
  pull_request:
  push:
    branches: [main, redesign-v2]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commits and working tree
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  desktop:
    name: Desktop checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Check release contracts and CI coverage
        run: |
          npm --prefix apps/desktop run check:release-contracts
          npm --prefix apps/desktop run test:ci
      - name: Install shell syntax checker
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh
      - name: Check JavaScript and shell syntax
        run: npm run desktop:check:syntax
      - name: Run Python unit tests
        run: npm --prefix apps/desktop run test:unit
      - name: Run graph and storage checks
        run: |
          npm --prefix apps/desktop run test:graph
          npm --prefix apps/desktop run test:storage
      - name: Run MCP and plugin checks
        run: npm --prefix apps/desktop run test:mcp

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Install ruff
        # Pinned: a new ruff release can add rules and turn this job red on an
        # unrelated pull request.
        run: python3 -m pip install --quiet ruff==0.16.4
      - name: Lint JavaScript and Python
        run: npm --prefix apps/desktop run lint

  ui-shards:
    name: UI smoke tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Install Playwright and Chromium
        run: |
          # Pinned: unpinned, CI silently tracked a newer Chromium than local
          # runs used, and the two disagreed on whether a keepalive fetch is
          # interceptable -- which is why a green local run could still fail here.
          npm install --global playwright@1.58.2
          playwright install --with-deps chromium
          echo "MY_SCHOLAR_PLAYWRIGHT_MODULE=$(npm root -g)/playwright" >> "$GITHUB_ENV"
      # The runner seeds a fresh library and starts a dedicated server for each
      # suite, and prints that server's log when a suite fails.
      - name: Run UI smoke tests
        run: npm --prefix apps/desktop run test:ui:ci -- --shard=${{ matrix.shard }}/4 --report=${{ runner.temp }}/ui-shard-${{ matrix.shard }}.json
      - name: Preserve shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  ui:
    name: UI smoke tests
    needs: [ui-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.ui-shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ui-results-*
          path: ${{ runner.temp }}/ui-results
          merge-multiple: true
      - name: Verify complete UI coverage
        run: node apps/desktop/scripts/verify-ui-results.cjs "${{ runner.temp }}/ui-results" 4

  runtime:
    name: Runtime checks (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      # macOS-only: two of these three check the packaged bundle and the mac
      # release layout, so they cannot run on the Linux jobs above.
      - name: Run runtime, installation and release checks
        run: npm --prefix apps/desktop run test:runtime
