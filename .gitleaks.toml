[extend]
useDefault = true

[allowlist]
description = "Generated desktop build and packaging output, which is gitignored and scanned separately before release, and the renderer's UI state key names: a `*StorageKey = 'my-scholar-...'` constant names a state entry, but the identifier ends in `key` and the value carries enough entropy to read as a generic API key"
paths = [
  '''^apps/desktop/build/''',
  '''^apps/desktop/dist/'''
]
regexes = [
  '''^my-scholar-[a-z0-9-]+$''',
  # Public tokenizer strategy identifier, not a credential.
  '''^utf8-weighted-estimate$''',
  # Public signing test vector from https://www.volcengine.com/docs/6369/67269.
  '''^WkRZeE1EQmxPVGhsWWpWak5HVmtNbUUxTXpZeU9UVXlOMlE1TmpZeVlqTQ==$'''
]
