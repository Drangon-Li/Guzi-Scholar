<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>生词本</title><link rel="stylesheet" href="styles.css"></head><body>
    <section id="vocabulary-view" class="view">
      <div class="vocabulary-layout">
        <div class="library-main-heading"><div><div class="eyebrow">VOCABULARY</div><h1>生词本</h1><p class="library-subtitle">收藏原文中的单词与短语，带着原句复习。</p></div><div class="vocabulary-toolbar"><button id="vocabulary-reload" class="secondary-button compact-button" type="button">刷新</button><button id="vocabulary-start-review" class="primary-button compact-button" type="button" disabled>开始复习</button></div></div>
        <p id="vocabulary-status" class="panel-status" role="status" aria-live="polite" hidden></p>
        <div id="vocabulary-browser"><div class="vocabulary-filters"><label class="search-box"><span>⌕</span><input id="vocabulary-search" type="search" placeholder="搜索词条、释义、原句或标签" aria-label="搜索生词本"></label><select id="vocabulary-filter" aria-label="生词状态"><option value="all">全部</option><option value="learning">未掌握</option><option value="mastered">已掌握</option><option value="unfiled">未分类</option></select><select id="vocabulary-tag" aria-label="生词标签"><option value="">全部标签</option></select><span id="vocabulary-count" class="library-subtitle">0 个词条</span></div><div id="vocabulary-list" class="vocabulary-list"><div class="empty-state">阅读原文时选中单词或短语，点击「加入生词本」。</div></div></div>
        <section id="vocabulary-review" class="vocabulary-review" aria-label="生词复习" hidden></section>
      </div>
    </section>

<script src="plugin-sdk.js"></script><script src="vocabulary.js"></script><script src="main.js"></script></body></html>
